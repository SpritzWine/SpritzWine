# SpritzWine graphical installer (libcosmic / COSMIC look).
#
# Standalone crate -- depends on installer/core for all deploy logic and adds only the GUI.
# Kept out of the rust/ Wine workspace and out of core's lockfile so the heavy
# libcosmic/winit/wgpu tree never touches the Wine build.
#
# libcosmic has no crates.io releases; it is pinned to a specific master commit. The
# feature set mirrors pop-os/cosmic-app-template (a known-good windowed-app baseline).
# The rev is kept in step with beisl-gui's (the other libcosmic app in the family), so a
# toolkit change is met once, in both, rather than twice months apart. beisl-gui also
# enables "wayland" for Frosted Glass; this installer draws no frosted surface, so it
# stays on the smaller feature set.
[package]
name = "spritzwine-setup"
version = "0.1.0"
edition = "2021"
description = "Graphical installer for SpritzWine (deploy to Steam / Lutris / a prefix)"
license = "LGPL-2.1-or-later"
publish = false

[[bin]]
name = "spritzwine-setup"
path = "src/main.rs"

[dependencies]
spritzwine-install-core = { path = "../core" }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "d4d71fd53e5ed6bd3a430089114dffa2da3cd498"
default-features = false
features = ["dbus-config", "tokio", "winit", "wgpu"]
