[package]
name = "wine_avrt_pe"
version = "0.1.0"
edition = "2024"
publish = false

# PE-side Rust for avrt.dll (MMCSS: AvSetMmThreadCharacteristics & friends).
# Like the sibling `wine_ntdll_pe` staticlib, this links directly into Wine's PE
# `avrt.dll` (winegcc -nodefaultlibs path via EXTRADLLFLAGS). It is a freestanding
# `no_std` static library with no heap (a fixed-size, spinlock-guarded handle table)
# and aborts on panic, since that environment has no Rust unwinder.
[lib]
name = "wine_avrt_pe"
crate-type = ["staticlib"]
path = "src/lib.rs"

# The PE link environment has no unwinder; abort on panic so no eh_personality /
# _Unwind_Resume machinery is required. (Excluded from the workspace so this profile
# is honored rather than ignored -- see ../../Cargo.toml `exclude`.)
#
# codegen-units = 1 makes the crate one object, so the PE link pulls every entry
# point by forcing the single anchor symbol (-Wl,-u / /include:) -- mirrors ntdll_pe.
[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = true
strip = true

[profile.dev]
panic = "abort"
