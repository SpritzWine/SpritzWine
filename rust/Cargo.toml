[package]
name = "wine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wine"
path = "src_poc/main.rs"

[dependencies]
wine_api = {path = "src_lib"}

[workspace]
members = [
"src_lib",
"src_dll/ntdll",
"tests",
"examples",

# programms
"src_programs/ping",
"src_programs/dir",
]
# PE-side staticlib: kept out of the workspace so its own `panic = "abort"`
# profile is honored. Built explicitly (see build.sh), linked into ntdll.dll.so.
exclude = [
"src_dll/ntdll_pe",
]

[workspace.lints.rust]
rust_2024_compatibility = "warn"

[workspace.package]
publish = true
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bindgen = "0.72.1"
wine_api = {path = "src_lib"}
